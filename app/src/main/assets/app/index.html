<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390, user-scalable=no">
<title>SomaSense</title>
<style>
@font-face { font-family: 'Atkinson Hyperlegible'; font-weight: 400; src: url(atkinson-400.woff2) format('woff2'); }
@font-face { font-family: 'Atkinson Hyperlegible'; font-weight: 700; src: url(atkinson-700.woff2) format('woff2'); }
html, body { margin: 0; height: 100%; overflow: hidden; background: #121622; -webkit-tap-highlight-color: transparent; }
body { -webkit-user-select: none; user-select: none; }
input, textarea { -webkit-user-select: text; user-select: text; }
</style>
</head>
<body>
<div id="app"></div>
<template id="dc-template">

<div style="width: 390px; height: {{phoneH}}px; position: relative; overflow: hidden; background: #F3F6F6; color: #14282C; font-family: 'Atkinson Hyperlegible', system-ui, sans-serif; font-size: 16px; line-height: 1.35">

<sc-if value="{{isHome}}" hint-placeholder-val="{{true}}">
<div style="position: absolute; top: 0; left: 0; right: 0; bottom: {{homeBottom}}; display: flex; flex-direction: column">
  <div style="height: 56px; flex: none; display: flex; align-items: center; justify-content: space-between; padding: 0 8px">
    <button type="button" aria-label="Previous day" onClick="{{dayPrev}}" style="width: 44px; height: 44px; border: 0; background: transparent; color: #14282C; cursor: pointer; display: flex; align-items: center; justify-content: center">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
    </button>
    <div style="text-align: center">
      <div style="font-size: 20px; font-weight: 700">{{homeTitle}}</div>
      <div style="font-size: 13px; color: #4F6368">{{homeSub}}</div>
    </div>
    <button type="button" aria-label="Next day" disabled="{{isToday}}" onClick="{{dayNext}}" style="width: 44px; height: 44px; border: 0; background: transparent; color: {{nextColor}}; cursor: pointer; display: flex; align-items: center; justify-content: center">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg>
    </button>
  </div>

  <div style="flex: none; display: flex; justify-content: center; padding-bottom: 4px">
    <div style="display: flex; background: #FFFFFF; border: 1px solid #C4D0D0; border-radius: 22px; padding: 1px; gap: 2px">
      <sc-for list="{{viewChips}}" as="v" hint-placeholder-count="4">
        <button type="button" aria-pressed="{{v.on}}" onClick="{{v.pick}}" style="min-width: 76px; height: 42px; border: 0; border-radius: 21px; background: {{v.bg}}; color: {{v.fg}}; font: inherit; font-weight: 700; cursor: pointer">{{v.label}}</button>
      </sc-for>
    </div>
  </div>

  <div data-stage style="flex: 1; min-height: 0; position: relative; display: flex; justify-content: center; align-items: flex-start; overflow: hidden">
    <button type="button" aria-label="{{stageAria}}" onPointerDown="{{stageDown}}" onPointerMove="{{stageMove}}" onPointerUp="{{stageUp}}" onPointerCancel="{{stageCancel}}" onLostPointerCapture="{{stageCancel}}" onContextMenu="{{noMenu}}" onKeyDown="{{stageKey}}" style="position: absolute; left: 0; top: 0; width: 100%; height: 100%; border: 0; padding: 0; margin: 0; background: transparent; cursor: grab; touch-action: none"></button>
    <canvas aria-hidden="true" style="position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: {{glDisplay}}; pointer-events: none"></canvas>
    <div data-fig style="position: relative; width: {{figW}}px; height: {{figH}}px; flex: none; transform: {{figTransform}}; pointer-events: none">
      <sc-for list="{{bodyFrames}}" as="f" hint-placeholder-count="1">
        <img src="{{f.url}}" alt="" draggable="false" onLoad="{{figLoad}}" style="position: absolute; left: 0; top: 0; width: 100%; height: 100%; opacity: {{f.opacity}}; transform: {{bodyFlip}}; pointer-events: none">
      </sc-for>
    </div>
    <div aria-hidden="true" style="position: absolute; left: 50%; top: 0; width: {{figW}}px; height: {{figH}}px; margin-left: {{figHalf}}px; transform: {{figTransform}}; pointer-events: none; mix-blend-mode: multiply">
      <svg viewBox="-120 0 240 440" preserveAspectRatio="none" style="position: absolute; left: 0; top: 0; width: 100%; height: 100%; overflow: visible">
        <defs><filter id="paintEdge" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="0.7"></feGaussianBlur></filter></defs>
        <sc-for list="{{areaPaths}}" as="a" hint-placeholder-count="0">
          <path d="{{a.d}}" fill="#2E8F95" stroke="#2E8F95" stroke-width="0.6" stroke-linejoin="round" opacity="{{a.opacity}}" filter="url(#paintEdge)"></path>
        </sc-for>
      </svg>
    </div>
    <div style="position: absolute; left: 50%; top: 0; width: {{figW}}px; height: {{figH}}px; margin-left: {{figHalf}}px; transform: {{figTransform}}; pointer-events: none">
      <sc-for list="{{pinButtons}}" as="p" hint-placeholder-count="0">
        <button type="button" aria-label="{{p.aria}}" disabled="{{p.hidden}}" onClick="{{p.remove}}" style="position: absolute; left: {{p.l}}; top: {{p.t}}; width: {{p.size}}; height: {{p.size}}; transform: translate(-50%, -50%) scale({{markScale}}); border-radius: 50%; border: 2px solid #FFFFFF; background: #0B6169; color: #FFFFFF; font: inherit; font-size: {{p.font}}; font-weight: 700; padding: 0; opacity: {{p.opacity}}; pointer-events: {{p.events}}; cursor: pointer">{{p.n}}</button>
      </sc-for>
    </div>
    <sc-if value="{{showSideLabels}}" hint-placeholder-val="{{true}}">
      <div style="position: absolute; left: 14px; top: 12px; font-size: 13px; font-weight: 700; color: #4F6368; pointer-events: none">{{screenLeftSide}}</div>
      <div style="position: absolute; right: 14px; top: 12px; font-size: 13px; font-weight: 700; color: #4F6368; pointer-events: none">{{screenRightSide}}</div>
    </sc-if>
    <sc-if value="{{isZoomed}}" hint-placeholder-val="{{false}}">
      <div style="position: absolute; left: 12px; bottom: 12px; display: flex; gap: 8px">
        <button type="button" aria-label="Turn body left" onClick="{{turnLeft}}" style="width: 48px; height: 48px; border-radius: 50%; border: 1px solid #C4D0D0; background: #FFFFFF; color: #14282C; padding: 0; cursor: pointer; display: flex; align-items: center; justify-content: center">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8v5h5"></path><path d="M4.6 13a8 8 0 1 0 1.9-6.6L4 8.8"></path></svg>
        </button>
        <button type="button" aria-label="Turn body right" onClick="{{turnRight}}" style="width: 48px; height: 48px; border-radius: 50%; border: 1px solid #C4D0D0; background: #FFFFFF; color: #14282C; padding: 0; cursor: pointer; display: flex; align-items: center; justify-content: center">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 8v5h-5"></path><path d="M19.4 13a8 8 0 1 1-1.9-6.6L20 8.8"></path></svg>
        </button>
      </div>
    </sc-if>
    <div style="position: absolute; right: 12px; bottom: 12px; display: flex; flex-direction: column; gap: 8px">
      <button type="button" aria-label="Zoom in" disabled="{{zoomInOff}}" onClick="{{zoomIn}}" style="width: 48px; height: 48px; border-radius: 50%; border: 1px solid #C4D0D0; background: #FFFFFF; color: {{zoomInColor}}; padding: 0; cursor: pointer; display: flex; align-items: center; justify-content: center">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14"></path><path d="M5 12h14"></path></svg>
      </button>
      <button type="button" aria-label="Zoom out" disabled="{{zoomOutOff}}" onClick="{{zoomOut}}" style="width: 48px; height: 48px; border-radius: 50%; border: 1px solid #C4D0D0; background: #FFFFFF; color: {{zoomOutColor}}; padding: 0; cursor: pointer; display: flex; align-items: center; justify-content: center">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"></path></svg>
      </button>
    </div>
  </div>

  <sc-if value="{{noneSelected}}" hint-placeholder-val="{{true}}">
    <div style="flex: none; min-height: 76px; box-sizing: border-box; background: #FFFFFF; border-top: 1px solid #D3DCDC; padding: 10px 16px; display: flex; flex-direction: column; justify-content: center">
      <div style="font-weight: 700">{{mapHint}}</div>
      <div style="font-size: 13px; color: #4F6368">{{mapHintSub}}</div>
    </div>
  </sc-if>
  <sc-if value="{{someSelected}}" hint-placeholder-val="{{false}}">
    <div role="region" aria-label="Add details for marked points" style="flex: none; height: 156px; box-sizing: border-box; position: relative; z-index: 2; background: #FFFFFF; border-radius: 20px 20px 0 0; box-shadow: 0 -4px 20px rgba(20, 40, 44, 0.16); padding: 14px 16px 18px; display: flex; flex-direction: column; justify-content: space-between; gap: 10px">
      <div style="display: flex; align-items: flex-start; gap: 8px">
        <div role="status" style="flex: 1; min-width: 0">
          <div style="font-size: 18px; font-weight: 700">What are you feeling here?</div>
          <div style="font-size: 14px; color: #4F6368; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{selectedSummary}}</div>
        </div>
        <button type="button" onClick="{{clearPins}}" style="flex: none; height: 44px; padding: 0 8px; margin: -6px -8px 0 0; border: 0; background: transparent; color: #0B6169; font: inherit; font-weight: 700; cursor: pointer">Clear</button>
      </div>
      <button type="button" onClick="{{startCompose}}" style="flex: none; width: 100%; height: 52px; border: 0; border-radius: 26px; background: #0B6169; color: #FFFFFF; font: inherit; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px">
        Add symptom details
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"></path><path d="M13 6l6 6-6 6"></path></svg>
      </button>
    </div>
  </sc-if>
</div>
</sc-if>

<sc-if value="{{isCalendar}}" hint-placeholder-val="{{false}}">
<div style="position: absolute; top: 0; left: 0; right: 0; bottom: 80px; overflow-y: auto">
  <div style="padding: 16px 16px 8px; display: flex; align-items: flex-start; justify-content: space-between; gap: 12px">
    <div>
      <h1 style="margin: 0; font-size: 24px">Calendar</h1>
      <div style="font-size: 14px; color: #4F6368">Where and when symptoms were reported</div>
    </div>
    <button type="button" onClick="{{startShare}}" style="flex: none; height: 44px; padding: 0 16px; border-radius: 22px; border: 1px solid #0B6169; background: #FFFFFF; color: #0B6169; font: inherit; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 6px">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V4"></path><path d="M8 8l4-4 4 4"></path><path d="M5 13v6a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-6"></path></svg>
      Share
    </button>
  </div>
  <div style="display: flex; gap: 8px; padding: 4px 16px 8px; overflow-x: auto">
    <sc-for list="{{areaChips}}" as="c" hint-placeholder-count="5">
      <button type="button" aria-pressed="{{c.on}}" onClick="{{c.pick}}" style="flex: none; height: 44px; padding: 0 14px; border-radius: 22px; border: 1px solid {{c.bd}}; background: {{c.bg}}; color: {{c.fg}}; font: inherit; font-size: 15px; cursor: pointer">{{c.label}}</button>
    </sc-for>
  </div>
  <div style="display: flex; align-items: center; justify-content: space-between; padding: 0 8px">
    <button type="button" aria-label="Previous month" onClick="{{monthPrev}}" style="width: 44px; height: 44px; border: 0; background: transparent; color: #14282C; cursor: pointer; display: flex; align-items: center; justify-content: center">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
    </button>
    <div style="font-size: 18px; font-weight: 700">{{monthTitle}}</div>
    <button type="button" aria-label="Next month" onClick="{{monthNext}}" style="width: 44px; height: 44px; border: 0; background: transparent; color: #14282C; cursor: pointer; display: flex; align-items: center; justify-content: center">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg>
    </button>
  </div>
  <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 3px; padding: 0 12px">
    <sc-for list="{{weekdays}}" as="w" hint-placeholder-count="7">
      <div style="text-align: center; font-size: 13px; font-weight: 700; color: #4F6368; padding-bottom: 4px">{{w}}</div>
    </sc-for>
    <sc-for list="{{calCells}}" as="d" hint-placeholder-count="35">
      <button type="button" disabled="{{d.blank}}" aria-label="{{d.aria}}" aria-pressed="{{d.selected}}" onClick="{{d.pick}}" style="height: 48px; border-radius: 10px; border: {{d.border}}; background: {{d.bg}}; color: {{d.fg}}; font: inherit; font-weight: {{d.weight}}; padding: 0; cursor: {{d.cursor}}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; box-sizing: border-box">
        <span>{{d.label}}</span>
        <span style="font-size: 11px; line-height: 1">{{d.count}}</span>
      </button>
    </sc-for>
  </div>
  <div style="display: flex; align-items: center; gap: 12px; padding: 10px 16px; font-size: 13px; color: #4F6368; flex-wrap: wrap">
    <span>Highest severity</span>
    <span style="display: flex; align-items: center; gap: 4px"><span style="width: 14px; height: 14px; border-radius: 4px; background: #D6ECEC; display: block"></span>Mild</span>
    <span style="display: flex; align-items: center; gap: 4px"><span style="width: 14px; height: 14px; border-radius: 4px; background: #86C6C4; display: block"></span>Moderate</span>
    <span style="display: flex; align-items: center; gap: 4px"><span style="width: 14px; height: 14px; border-radius: 4px; background: #0B6169; display: block"></span>Severe</span>
    <span style="display: flex; align-items: center; gap: 4px"><span style="width: 14px; height: 14px; border-radius: 4px; background: #8EDB8F; color: #14282C; font-size: 11px; line-height: 14px; text-align: center; display: block" aria-hidden="true">✓</span>No symptoms</span>
  </div>

  <div style="margin: 4px 12px 16px; background: #FFFFFF; border: 1px solid #D3DCDC; border-radius: 16px; padding: 14px">
    <h2 style="margin: 0; font-size: 18px">{{calDayTitle}}</h2>
    <div style="font-size: 14px; color: #4F6368; margin-top: 2px">{{calDaySub}}</div>
    <sc-if value="{{calCanMarkFree}}" hint-placeholder-val="{{false}}">
      <button type="button" aria-pressed="{{calDayFree}}" onClick="{{toggleFree}}" style="width: 100%; height: 48px; margin-top: 10px; border-radius: 24px; border: 2px solid #2F8F46; background: {{freeBg}}; color: #14282C; font: inherit; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 13l4 4L19 7"></path></svg>
        No symptoms
      </button>
    </sc-if>
    <sc-if value="{{calDayHas}}" hint-placeholder-val="{{true}}">
      <div style="display: flex; gap: 16px; justify-content: center; margin: 12px 0 8px">
        <div style="text-align: center">
          <div style="position: relative; width: 86px; height: 158px">
            <img src="{{thumbFront}}" alt="" width="86" height="158" style="position: absolute; left: 0; top: 0">
            <sc-for list="{{calFrontDots}}" as="m" hint-placeholder-count="0">
              <span style="position: absolute; left: {{m.l}}; top: {{m.t}}; width: 10px; height: 10px; transform: translate(-50%, -50%); border-radius: 50%; background: #0B6169; border: 1px solid #FFFFFF; box-sizing: border-box; display: block"></span>
            </sc-for>
          </div>
          <div style="font-size: 13px; color: #4F6368; margin-top: 4px">Front</div>
        </div>
        <div style="text-align: center">
          <div style="position: relative; width: 86px; height: 158px">
            <img src="{{thumbBack}}" alt="" width="86" height="158" style="position: absolute; left: 0; top: 0">
            <sc-for list="{{calBackDots}}" as="m" hint-placeholder-count="0">
              <span style="position: absolute; left: {{m.l}}; top: {{m.t}}; width: 10px; height: 10px; transform: translate(-50%, -50%); border-radius: 50%; background: #0B6169; border: 1px solid #FFFFFF; box-sizing: border-box; display: block"></span>
            </sc-for>
          </div>
          <div style="font-size: 13px; color: #4F6368; margin-top: 4px">Back</div>
        </div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 8px">
        <sc-for list="{{calDayReports}}" as="r" hint-placeholder-count="2">
          <button type="button" onClick="{{r.open}}" style="text-align: left; min-height: 64px; padding: 10px 12px; border: 1px solid #D3DCDC; border-radius: 12px; background: #F3F6F6; color: #14282C; font: inherit; cursor: pointer">
            <span style="display: flex; justify-content: space-between; gap: 8px; font-weight: 700"><span>{{r.time}} · {{r.cats}}</span><span style="flex: none">{{r.sev}}</span></span>
            <span style="display: block; font-size: 14px; color: #4F6368; margin-top: 2px">{{r.where}}</span>
          </button>
        </sc-for>
      </div>
    </sc-if>
  </div>
</div>
</sc-if>

<sc-if value="{{isSettings}}" hint-placeholder-val="{{false}}">
<div style="position: absolute; top: 0; left: 0; right: 0; bottom: 80px; overflow-y: auto">
  <div style="padding: 16px 16px 8px">
    <h1 style="margin: 0; font-size: 24px">Settings</h1>
  </div>
  <div style="margin: 4px 12px 16px; background: #FFFFFF; border: 1px solid #D3DCDC; border-radius: 16px; padding: 14px">
    <h2 style="margin: 0 0 8px; font-size: 18px">About</h2>
    <p style="margin: 0 0 12px; font-size: 15px; line-height: 1.45">SomaSense is a free and open source calendar tool for logging symptoms and sensations that are felt across the body. All data entered into the application is stored locally without being transmitted to the developer or the hardware provider. You may share your own calendar log to email or other tools you have on device by selecting the Share option available in your calendar.</p>
    <p style="margin: 0 0 12px; font-size: 15px; line-height: 1.45">Use SomaSense to track feelings you have across the body over time and to monitor their progression or transience. When noticing any new or unusual pain or symptom, the tool can be used to create a log of a symptom’s progression for sharing with a physician. Please seek immediate care if you have a new symptom you haven’t addressed with your healthcare provider previously.</p>
    <p style="margin: 0 0 12px; font-size: 15px; line-height: 1.45">To customize body shape model to your body type, you may make modifications here:</p>
    <sc-if value="{{bodyOptionsOn}}" hint-placeholder-val="{{true}}">
      <div style="position: relative; height: 270px; background: #F3F6F6; border-radius: 12px; overflow: hidden">
        <img src="{{previewProbe}}" alt="" onLoad="{{previewLoad}}" style="display: none">
        <canvas role="img" aria-label="Preview of the body shape, from the front and the side" style="position: absolute; left: 0; top: 0; width: 100%; height: 100%"></canvas>
      </div>
      <label style="display: block; margin-top: 14px; font-weight: 700">Gender
        <input type="range" min="-100" max="100" step="1" value="{{bodyG}}" aria-valuetext="{{bodyGText}}" onChange="{{setBodyG}}" style="display: block; width: 100%; height: 44px; margin: 0; accent-color: #0B6169">
      </label>
      <div style="display: flex; justify-content: space-between; font-size: 13px; color: #4F6368; margin-top: -6px"><span>Feminine</span><span>Androgynous</span><span>Masculine</span></div>
      <label style="display: block; margin-top: 14px; font-weight: 700">Build
        <input type="range" min="-100" max="100" step="1" value="{{bodyB}}" aria-valuetext="{{bodyBText}}" onChange="{{setBodyB}}" style="display: block; width: 100%; height: 44px; margin: 0; accent-color: #0B6169">
      </label>
      <div style="display: flex; justify-content: space-between; font-size: 13px; color: #4F6368; margin-top: -6px"><span>Slimmer</span><span>Average</span><span>Fuller</span></div>
      <button type="button" disabled="{{bodyIsDefault}}" onClick="{{resetBody}}" style="width: 100%; height: 48px; margin: 14px 0 16px; border-radius: 24px; border: 1px solid {{bodyResetColor}}; background: #FFFFFF; color: {{bodyResetColor}}; font: inherit; font-weight: 700; cursor: pointer">Reset to default</button>
    </sc-if>
    <sc-if value="{{bodyOptionsOff}}" hint-placeholder-val="{{false}}">
      <p style="margin: 0 0 12px; font-size: 15px; line-height: 1.45">Body shape options aren’t available on this device.</p>
    </sc-if>
    <p style="margin: 0 0 12px; font-size: 15px; line-height: 1.45">SomaSense was authored by ncubeeight LLC for distribution on Github, Apple App Store and Android Play Store. Visit ncubeeight at <a href="https://ncubeeight.com" target="_blank" rel="noopener" style="color: #0B6169; font-weight: 700; overflow-wrap: anywhere">ncubeeight.com</a></p>
    <p style="margin: 0 0 12px; font-size: 15px; line-height: 1.45">The code on GitHub is open source under the Apache 2.0 license, which lets you use, modify and share it under that license's terms. If the code base is altered from original form into a new code-fork or integrated into a new app, please attribute <a href="https://ncubeeight.github.io/SomaSense/" target="_blank" rel="noopener" style="color: #0B6169; font-weight: 700; overflow-wrap: anywhere">ncubeeight.github.io/SomaSense</a> source code referring to open source under Apache 2.0 license but clarify how the code has been altered to your own users with your own new Privacy Policy. The original Privacy Policy should not be used for code created by other entities outside of ncubeeight LLC. Please include the reference to MakeHuman license in all derivative code if the body map is integrated into your versions of this app.</p>
    <p style="margin: 0 0 12px; font-size: 15px; line-height: 1.45">SomaSense was coded in ClaudeCode with supplemental support by Apple Xcode and Google Play Console, with additional support by Google Gemini for marketing collateral design.</p>
    <p style="margin: 0; font-size: 15px; line-height: 1.45">The body models used in SomaSense are provided by MakeHuman under open source license available to review here: <a href="https://github.com/makehumancommunity/makehuman/blob/master/LICENSE.md" target="_blank" rel="noopener" style="color: #0B6169; font-weight: 700; overflow-wrap: anywhere">https://github.com/makehumancommunity/makehuman/blob/master/LICENSE.md</a></p>
  </div>
  <div style="margin: 0 12px 16px; background: #FFFFFF; border: 1px solid #D3DCDC; border-radius: 16px; padding: 14px">
    <h2 style="margin: 0 0 8px; font-size: 18px">Your data</h2>

<sc-if value="{{hasPrivacy}}" hint-placeholder-val="{{false}}">
<div role="dialog" aria-label="Privacy policy" style="position: absolute; left: 0; top: 0; right: 0; bottom: 0; z-index: 4; background: #FFFFFF; display: flex; flex-direction: column">

      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12H5"></path><path d="M11 6l-6 6 6 6"></path></svg>

    <h2 style="margin: 0; font-size: 18px">Privacy policy</h2>
  </div>
  <div style="flex: 1; min-height: 0; overflow-y: auto; padding: 16px 16px 24px">
    <p style="margin: 0 0 12px; font-size: 14px; color: #4F6368">Effective November 3, 2026</p>
    <p style="margin: 0 0 12px; font-size: 15px; line-height: 1.45">SomaSense is a free and open source calendar tool from ncubeeight LLC for logging symptoms and sensations felt across the body. This policy explains what happens to the information you enter in the Android app. In short, your log stays on your phone unless you choose to share it, and ncubeeight LLC never receives it.</p>
    <h3 style="margin: 16px 0 6px; font-size: 16px">What the app stores on your phone</h3>
    <p style="margin: 0 0 12px; font-size: 15px; line-height: 1.45">SomaSense saves the following in its private storage on your phone:</p>
    <ul style="margin: 0 0 12px; padding-left: 20px; font-size: 15px; line-height: 1.45"><li style="margin-bottom: 4px">Your reports: date, time, symptom or sensation types, body locations, severity, descriptions and notes, medicines, physical activity, other sensations and concerns</li><li style="margin-bottom: 4px">The days you mark as symptom-free</li><li style="margin-bottom: 4px">Your settings: body shape and any symptom types, medicines, activities or sensations you remove from the lists of choices</li></ul>
    <p style="margin: 0 0 12px; font-size: 15px; line-height: 1.45">This can include health information, so please keep it in mind when you decide who can use your phone.</p>
    <h3 style="margin: 16px 0 6px; font-size: 16px">What ncubeeight LLC collects</h3>
    <p style="margin: 0 0 12px; font-size: 15px; line-height: 1.45">Nothing. The app has no accounts, advertising, analytics or crash reporting. It doesn’t have Android’s internet permission and requests no other permissions, so it can’t reach the internet or read your location, camera, microphone, contacts or files. ncubeeight LLC has no copy of your log and can’t see, recover or delete it for you.</p>
    <h3 style="margin: 16px 0 6px; font-size: 16px">When you share your log</h3>
    <p style="margin: 0 0 12px; font-size: 15px; line-height: 1.45">The Share buttons on the Calendar and Reports tabs send your information only when you choose to. You pick the app and the recipient in Android’s share sheet. A Calendar share includes a calendar picture, a PDF and a text list of that month’s entries. A Reports share includes a PDF and a text summary for the period you selected.</p>
    <p style="margin: 0 0 12px; font-size: 15px; line-height: 1.45">Once shared, the information is handled by the app and the people you sent it to, under their own privacy practices. Sending it by email or chat also means it travels over the internet through those services. SomaSense can’t recall anything you’ve already shared.</p>
    <p style="margin: 0 0 12px; font-size: 15px; line-height: 1.45">To prepare a share, the app keeps a temporary copy of the files on your phone until your next share or until you delete your data. Save to Files puts a PDF in the location you choose, where it stays until you remove it. Delete stored on-device data doesn’t remove PDFs you saved this way.</p>
    <h3 style="margin: 16px 0 6px; font-size: 16px">Backups and new phones</h3>
    <p style="margin: 0 0 12px; font-size: 15px; line-height: 1.45">SomaSense opts out of Android’s cloud backup and device transfer, so your log isn’t copied to your Google account and won’t move to a new phone. To keep a copy, share your log before changing phones.</p>
    <h3 style="margin: 16px 0 6px; font-size: 16px">Keeping and deleting your data</h3>
    <p style="margin: 0 0 12px; font-size: 15px; line-height: 1.45">Your data stays on your phone until you remove it. You can delete a single report from its detail screen, or select Delete stored on-device data in Settings to remove everything. Uninstalling the app also removes it. Deleted data can’t be restored.</p>
    <h3 style="margin: 16px 0 6px; font-size: 16px">Security</h3>
    <p style="margin: 0 0 12px; font-size: 15px; line-height: 1.45">Your log is protected by Android’s separation between apps and by your phone’s lock screen. SomaSense doesn’t have its own passcode, so anyone who can use your unlocked phone can open it. Please use a screen lock.</p>
    <h3 style="margin: 16px 0 6px; font-size: 16px">Other companies</h3>
    <p style="margin: 0 0 12px; font-size: 15px; line-height: 1.45">Companies that provide your phone and its software have their own privacy practices that SomaSense doesn’t control. These include Google Play if you install from there, Android, your phone’s maker and your keyboard app, which handles what you type.</p>
    <p style="margin: 0 0 12px; font-size: 15px; line-height: 1.45">Links in the app open in your web browser. This website is hosted by GitHub and loads fonts from Google, so those companies may receive your IP address and browser details when you visit. ncubeeight LLC doesn’t add analytics to this website.</p>
    <h3 style="margin: 16px 0 6px; font-size: 16px">Children</h3>
    <p style="margin: 0 0 12px; font-size: 15px; line-height: 1.45">SomaSense is not directed to children under 13, and ncubeeight LLC does not knowingly collect information from anyone, including children.</p>
    <h3 style="margin: 16px 0 6px; font-size: 16px">Changes to this policy</h3>
    <p style="margin: 0 0 12px; font-size: 15px; line-height: 1.45">If this policy changes, the updated version will be published here and in the app with a new effective date. Past versions are available in the project’s public history on GitHub.</p>
    <h3 style="margin: 16px 0 6px; font-size: 16px">Contact</h3>
    <p style="margin: 0 0 12px; font-size: 15px; line-height: 1.45">For questions about this policy, open an issue at <a href="https://github.com/ncubeeight/SomaSense/issues" target="_blank" rel="noopener" style="color: #0B6169; font-weight: 700">the SomaSense GitHub repository</a>. Issues are public, so please don’t include health details or other personal information.</p>
    <p style="margin: 16px 0 0; font-size: 15px; line-height: 1.45">This policy is also on the web at <a href="https://ncubeeight.github.io/SomaSense/privacy/" target="_blank" rel="noopener" style="color: #0B6169; font-weight: 700">ncubeeight.github.io/SomaSense/privacy</a>.</p>
  </div>
</div>

<script>

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.live = !!props.live && typeof window !== 'undefined' && !!window.AppShell;
    this.TODAY = this.live ? this.iso(new Date()) : '2026-10-27';
    this.CATS = ['Pain', 'Rash / skin', 'Swelling'];
    this.ACTS = ['Exercise', 'Sitting', 'Resting'];

    this.seen = new Map();
    this.FEET_GAP = 32;
    this.MAX_ZOOM = 6;
    this.SHAPES_URL = 'body-shapes.json';
    this.shapeVer = 0;
    this.HOLD_MS = 350;
    this.MAX_TOUCHES = 400;
    this.MAX_PAINT = 2048;
    this.BRUSH = 6;
    // A scribbled area joins gaps up to about two and a half brush widths across, and its edge is rounded over most of a brush.
    this.FILL_CLOSE = 2;
    this.FILL_SMOOTH = 0.8;
    this.SPLASH_URL = 'somasense-splash.jpg';
    this.SPLASH_IN = 600;
    this.SPLASH_HOLD = 1600;
    this.SPLASH_FADE = 1000;
    this.FRAMES = ["frames/body-000.png", "frames/body-005.png", "frames/body-010.png", "frames/body-015.png", "frames/body-020.png", "frames/body-025.png", "frames/body-030.png", "frames/body-035.png", "frames/body-040.png", "frames/body-045.png", "frames/body-050.png", "frames/body-055.png", "frames/body-060.png", "frames/body-065.png", "frames/body-070.png", "frames/body-075.png", "frames/body-080.png", "frames/body-085.png", "frames/body-090.png", "frames/body-095.png", "frames/body-100.png", "frames/body-105.png", "frames/body-110.png", "frames/body-115.png", "frames/body-120.png", "frames/body-125.png", "frames/body-130.png", "frames/body-135.png", "frames/body-140.png", "frames/body-145.png", "frames/body-150.png", "frames/body-155.png", "frames/body-160.png", "frames/body-165.png", "frames/body-170.png", "frames/body-175.png", "frames/body-180.png"];
    const start = props.startScreen || 'home';
    const form = this.blankForm();
    const saved = this.live ? this.loadData() : null;
    let selected = [];
    if (start === 'selected' || start === 'report') {
      selected = [this.zonePoint('f-forearm-L'), this.zonePoint('f-hand-L'), this.zonePoint('f-knee-R')];
    }
    if (start === 'report') {
      form.cats = ['Tingling / numbness', 'Burning'];
      form.desc = 'Pins and needles in the forearm and hand, with a burning patch on the knee.';
      form.severity = 6;
      form.sevNote = 'Comes in waves. Hard to grip a cup when it peaks.';
      form.meds = ['Ibuprofen'];
      form.acts = ['Desk work'];
      form.senses = ['Fatigue'];
      form.concern = 'Is the numbness spreading? Ask about a nerve test.';
    }
    this.state = {
      tab: start === 'calendar' ? 'calendar' : start === 'reports' ? 'reports' : 'home',
      zoom: 1, panX: 0, panY: 0, glFailed: false,
      symptomFree: this.live ? saved.symptomFree : ['2026-10-16', '2026-10-23'],
      hiddenCats: this.live ? saved.hiddenCats : [],
      hiddenMeds: this.live ? saved.hiddenMeds : [],
      hiddenActs: this.live ? saved.hiddenActs : [],
      hiddenSenses: this.live ? saved.hiddenSenses : [],
      shape: { g: 0, b: 0 }, shapesFailed: false, thumbRev: 0,

      composing: start === 'report',
      yaw: 0,
      selected: selected,
      form: form,
      reports: this.live ? saved.reports : this.seedReports(),
      deleteArmed: false,
      editing: null,
      wipeArmed: false,
      privacy: false,
      share: null,
      homeDay: this.TODAY,
      calMonth: this.TODAY.slice(0, 7),
      calDay: this.TODAY,
      area: 'all',
      range: 30,
      drillCat: null,
      detailId: null,
      toast: ''
    };
  }

  nowTime() {
    const d = new Date();
    return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
  }
  loadData() {
    const empty = { reports: [], symptomFree: [], hiddenCats: [], hiddenMeds: [], hiddenActs: [], hiddenSenses: [] };
    let text = '';
    try {
      text = window.AppShell.readData();
      if (!text) return empty;
      const data = JSON.parse(text);
      return { reports: data.reports || [], symptomFree: data.symptomFree || [], hiddenCats: data.hiddenCats || [], hiddenMeds: data.hiddenMeds || [], hiddenActs: data.hiddenActs || [], hiddenSenses: data.hiddenSenses || [] };
    } catch (e) {
      // An unreadable file is set aside rather than overwritten.
      window.AppShell.setAsideData();
      this.loadFailed = true;
      return empty;
    }
  }
  // Points are stored on the default body, so the chosen shape can be applied to them at launch.
  diskPoint(pt) {
    const round = (v) => Math.round(v * 100) / 100;
    const base = (q) => {
      if (!this.BODY.ready() || this.shapeVer === 0) return q.p.map(round);
      const P = this.BODY.positions(), B = this.BODY.basePositions();
      if (q.v === undefined) q.v = this.BODY.nearest(q.p);
      return [0, 1, 2].map((k) => round(B[q.v + k] + q.p[k] - P[q.v + k]));
    };
    const out = { id: pt.id, p: base(pt), n: pt.n.map(round), label: pt.label, area: pt.area };
    if (pt.path) {
      out.path = pt.path.map((q) => ({ p: base(q), n: q.n.map(round) }));
      out.r = round(pt.r);
      if (pt.yaw !== undefined) out.yaw = pt.yaw;
    }
    return out;
  }
  saveData(reports, symptomFree, hidden = this.hiddenNow()) {
    if (!this.live) return;
    const json = JSON.stringify({ v: 1, reports: reports.map((r) => ({ ...r, points: r.points.map((p) => this.diskPoint(p)) })), symptomFree: symptomFree, hiddenCats: hidden.hiddenCats, hiddenMeds: hidden.hiddenMeds, hiddenActs: hidden.hiddenActs, hiddenSenses: hidden.hiddenSenses });
    if (!window.AppShell.writeData(json)) this.flash('This could not be saved. Check the phone’s free storage.');
  }
  blankForm() {
    this.formDefault = this.live ? this.nowTime() : '14:30';
    return { time: this.formDefault, cats: [], catOther: '', desc: '', severity: 1, sevNote: '', meds: [], medOther: '', acts: [], actOther: '', senses: [], senseOther: '', concern: '' };
  }

  bodyModel() {
    function makeBody() {
      // Camera matches the rendered frames: orthographic, looking slightly down.
      const PITCH = 8 * Math.PI / 180, CY = 220;
      const cosP = Math.cos(PITCH), sinP = Math.sin(PITCH);
      let P = null, P0 = null, T = null, G = null, names = null, proj = null, projYaw = null;
      function setMesh(data) {
        P = data.p.map((v) => v / 10);
        P0 = P.slice();
        T = data.t;
        G = data.g;
        names = data.tags;
        proj = new Float32Array(P.length);
        projYaw = null;
      }
      // Moves every vertex from the default body by the weighted shape offsets.
      function setOffsets(list) {
        for (let i = 0; i < P.length; i++) {
          let v = P0[i];
          for (const o of list) if (o.w) v += o.d[i] / 10 * o.w;
          P[i] = v;
        }
        projYaw = null;
      }
      function nearest(p) {
        let best = Infinity, at = 0;
        for (let i = 0; i < P.length; i += 3) {
          const d = (P[i] - p[0]) ** 2 + (P[i + 1] - p[1]) ** 2 + (P[i + 2] - p[2]) ** 2;
          if (d < best) { best = d; at = i; }
        }
        return at;
      }
      function toScreen(x, y, z, yaw) {
        const t = yaw * Math.PI / 180, c = Math.cos(t), s = Math.sin(t);
        const cx = x * c + z * s, cz = -x * s + z * c, v = y - CY;
        return { sx: cx, sy: v * cosP + cz * sinP + CY, depth: cz * cosP - v * sinP };
      }
      function viewDir(yaw) {
        const t = yaw * Math.PI / 180;
        return [-Math.sin(t) * cosP, -sinP, Math.cos(t) * cosP];
      }
      function project(yaw) {
        if (projYaw === yaw) return;
        const t = yaw * Math.PI / 180, c = Math.cos(t), s = Math.sin(t);
        for (let i = 0; i < P.length; i += 3) {
          const cx = P[i] * c + P[i + 2] * s, cz = -P[i] * s + P[i + 2] * c, v = P[i + 1] - CY;
          proj[i] = cx;
          proj[i + 1] = v * cosP + cz * sinP + CY;
          proj[i + 2] = cz * cosP - v * sinP;
        }
        projYaw = yaw;
      }
      // Finds the surface nearest the viewer under a screen point.
      function cast(sx, sy, yaw) {
        if (!P) return { hit: false };
        project(yaw);
        let best = -Infinity, bt = -1, bu = 0, bv = 0;
        for (let i = 0; i < T.length; i += 3) {
          const a = T[i] * 3, b = T[i + 1] * 3, c = T[i + 2] * 3;
          const ax = proj[a], ay = proj[a + 1], bx = proj[b], by = proj[b + 1], cx = proj[c], cy = proj[c + 1];
          if ((sx < ax && sx < bx && sx < cx) || (sx > ax && sx > bx && sx > cx) || (sy < ay && sy < by && sy < cy) || (sy > ay && sy > by && sy > cy)) continue;
          const den = (by - cy) * (ax - cx) + (cx - bx) * (ay - cy);
          if (Math.abs(den) < 1e-9) continue;
          const u = ((by - cy) * (sx - cx) + (cx - bx) * (sy - cy)) / den;
          const v = ((cy - ay) * (sx - cx) + (ax - cx) * (sy - cy)) / den;
          if (u < 0 || v < 0 || u + v > 1) continue;
          const w = 1 - u - v;
          const depth = u * proj[a + 2] + v * proj[b + 2] + w * proj[c + 2];
          if (depth > best) { best = depth; bt = i; bu = u; bv = v; }

    const s = this.state;
    const match = (p) => s.area === 'all' || p.area === s.area;
    const visible = s.reports.map((r) => ({ r: r, pts: r.points.filter(match) })).filter((x) => x.pts.length > 0);
    const parts = s.calMonth.split('-').map(Number);
    const first = new Date(parts[0], parts[1] - 1, 1);
    const daysIn = new Date(parts[0], parts[1], 0).getDate();
    const cells = [];
    for (let i = 0; i < first.getDay(); i++) {
      cells.push({ blank: true, label: '', count: '', aria: 'No date', selected: false, border: '0', bg: 'transparent', fg: '#14282C', weight: 400, cursor: 'default', pick: () => {} });
    }
    for (let d = 1; d <= daysIn; d++) {
      const key = s.calMonth + '-' + String(d).padStart(2, '0');
      const list = visible.filter((x) => x.r.date === key);
      const max = list.reduce((m, x) => Math.max(m, x.r.severity), 0);
      const sel = key === s.calDay;
      const today = key === this.TODAY;
      const free = s.symptomFree.includes(key);
      const bg = free ? '#8EDB8F' : !list.length ? '#FFFFFF' : max <= 3 ? '#D6ECEC' : max <= 6 ? '#86C6C4' : '#0B6169';
      const fg = list.length && max > 6 ? '#FFFFFF' : '#14282C';
      cells.push({
        blank: false, label: d, count: free ? '✓' : list.length ? String(list.length) : '',
        aria: this.fmtShort(key) + ', ' + (free ? 'no symptoms' : this.plural(list.length, 'report')) + (list.length ? ', highest severity ' + max : '') + (today ? ', today' : ''),
        selected: sel, border: sel ? '3px solid #B8430F' : today ? '2px solid #14282C' : '1px solid #E4EAEA',
        bg: bg, fg: fg, weight: today ? 700 : 400, cursor: 'pointer',
        pick: () => this.setState({ calDay: key })
      });
    }
    const dayFree = s.symptomFree.includes(s.calDay);
    const custom = this.customShape() && this.shapeVer > 0 && !s.glFailed;
    const thumbsFresh = custom && this.thumbs && this.thumbs.ver === this.shapeVer;
    if (custom && !thumbsFresh && s.tab === 'calendar' && !this.thumbPending && typeof setTimeout === 'function') {
      this.thumbPending = true;
      setTimeout(() => this.makeThumbs(), 0);
    }
    const dayList = visible.filter((x) => x.r.date === s.calDay).sort((a, b) => a.r.time.localeCompare(b.r.time));
    const dots = (front) => dayList.reduce((a, x) => a.concat(x.pts.reduce((b, p) => b.concat(p.path || [p]), []).filter((p) => (p.n[2] >= 0) === front)), []).map((p) => this.pos(p, front ? 0 : 180));
    const shiftMonth = (n) => () => {
      const dt = new Date(parts[0], parts[1] - 1 + n, 1);
      this.setState({ calMonth: this.iso(dt).slice(0, 7) });
    };
    return {
      areaChips: this.AREAS.map((a) => this.chip(a[1], s.area === a[0], () => this.setState({ area: a[0] }))),
      monthTitle: first.toLocaleDateString('en-US', { month: 'long', year: 'numeric' }),
      monthPrev: shiftMonth(-1),
      monthNext: shiftMonth(1),
      weekdays: ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'],
      calCells: cells,
      thumbFront: thumbsFresh ? this.thumbs.f : this.FRAMES[0],
      thumbBack: thumbsFresh ? this.thumbs.b : this.FRAMES[36],
      calDayTitle: this.fmtDay(s.calDay),
      calDaySub: dayFree ? 'Marked symptom-free. Tap below to undo.' : dayList.length ? this.plural(dayList.length, 'report') : 'Nothing reported' + (s.area === 'all' ? '' : ' in this area'),
      calCanMarkFree: s.calDay <= this.TODAY && !s.reports.some((r) => r.date === s.calDay),
      calDayFree: dayFree,
      freeBg: dayFree ? '#8EDB8F' : '#FFFFFF',
      toggleFree: () => {
        const q = this.state;
        const symptomFree = q.symptomFree.includes(q.calDay) ? q.symptomFree.filter((d) => d !== q.calDay) : q.symptomFree.concat([q.calDay]);
        this.saveData(q.reports, symptomFree);
        this.setState({ symptomFree: symptomFree });
      },
      calDayHas: dayList.length > 0,
      calFrontDots: dots(true),
      calBackDots: dots(false),
      calDayReports: dayList.map((x) => ({
        time: this.fmtTime(x.r.time), cats: x.r.cats.join(', '), sev: x.r.severity + '/10',
        where: x.pts.map((p) => p.label).join(', '),
        open: () => this.setState({ detailId: x.r.id })
      }))
    };
  }

  reportData(range) {
    const s = this.state;
    const from = this.addDays(this.TODAY, -(range - 1));
    const inRange = s.reports.filter((r) => r.date >= from && r.date <= this.TODAY);
    const mean = (list) => list.length ? (list.reduce((a, r) => a + r.severity, 0) / list.length).toFixed(1) : '0';
    const groups = Array.from(new Set([].concat(...inRange.map((r) => r.cats)))).map((c) => ({ cat: c, list: inRange.filter((r) => r.cats.includes(c)) })).filter((g) => g.list.length > 0).sort((a, b) => b.list.length - a.list.length);
    const freeDays = s.symptomFree.filter((d) => d >= from && d <= this.TODAY && !inRange.some((r) => r.date === d)).length;
    return { from, inRange, days: new Set(inRange.map((r) => r.date)).size, freeDays, mean, avg: mean(inRange), groups };
  }
  typeDetail(list, range, from) {
    const size = range === 7 ? 1 : 7;
    const n = Math.ceil(range / size);
    const buckets = [];
    for (let i = 0; i < n; i++) {
      const end = this.addDays(this.TODAY, -(n - 1 - i) * size);
      const startRaw = this.addDays(end, -(size - 1));
      const start = startRaw < from ? from : startRaw;
      buckets.push({ start: start, end: end, n: list.filter((r) => r.date >= start && r.date <= end).length });
    }
    const tally = (arr) => {
      const m = {};
      arr.forEach((v) => { m[v] = (m[v] || 0) + 1; });
      return Object.keys(m).map((k) => ({ label: k, count: m[k] })).sort((a, b) => b.count - a.count);
    };
    const parts = ['Morning', 'Afternoon', 'Evening', 'Night'].map((p) => ({ label: p, count: list.filter((r) => this.partOf(r.time) === p).length }));
    return {
      size, buckets, parts,
      maxB: Math.max(1, ...buckets.map((b) => b.n)),
      maxP: Math.max(1, ...parts.map((p) => p.count)),
      where: tally(list.reduce((a, r) => a.concat(r.points.map((p) => p.label)), [])).slice(0, 5),
      ctx: tally(list.reduce((a, r) => a.concat(r.meds, r.acts, r.senses), [])).slice(0, 8)
    };
  }
  reportsVals() {
    const s = this.state;
    const { from, inRange, days, mean: avg, groups } = this.reportData(s.range);
    const top = groups.length ? groups[0].list.length : 1;
    const active = groups.find((g) => g.cat === s.drillCat) || groups[0];
    const out = {
      exportPdf: () => this.openReportShare(),
      // Only the prototype shows sample entries; the installed app shows the person's own.
      sampleNote: this.live ? '' : 'Sample data. ',
      rangeChips: [7, 30, 90].map((n) => this.chip(n + ' days', s.range === n, () => this.setState({ range: n }))),
      statTiles: [
        { value: inRange.length, label: 'Reports' },
        { value: days, label: 'Days with symptoms' },
        { value: avg(inRange), label: 'Avg severity' }
      ],
      catRows: groups.map((g) => {
        const on = !!active && g.cat === active.cat;
        return {
          label: g.cat, count: g.list.length, avg: avg(g.list), on: on, pct: (g.list.length / top * 100) + '%',
          rowBg: on ? '#E6F2F2' : 'transparent', barColor: '#0B6169',
          pick: () => this.setState({ drillCat: g.cat })
        };
      }),
      noCats: groups.length === 0,
      hasDrill: !!active,
      drillTitle: '', drillSub: '', trendAria: '', trendBars: [], trendStart: '', trendEnd: '', whereRows: [], whenRows: [], contextTags: [], noContext: false
    };
    if (!active) return out;
    const list = active.list;
    const { size, buckets, maxB, where, parts, maxP, ctx } = this.typeDetail(list, s.range, from);
    const maxW = where.length ? where[0].count : 1;
    out.drillTitle = active.cat;
    out.drillSub = this.plural(list.length, 'report') + ' in the last ' + s.range + ' days';
    out.trendAria = active.cat + ' reports per ' + (size === 1 ? 'day' : 'week') + ': ' + buckets.map((b) => b.n).join(', ');
    out.trendBars = buckets.map((b) => ({ n: b.n ? b.n : '', h: (b.n ? Math.max(4, b.n / maxB * 56) : 0) + 'px', tip: this.fmtShort(b.start) + (size > 1 ? ' to ' + this.fmtShort(b.end) : '') + ': ' + b.n }));
    out.trendStart = this.fmtShort(buckets[0].start);
    out.trendEnd = this.fmtShort(buckets[buckets.length - 1].end);
    out.whereRows = where.map((w) => ({ label: w.label, count: w.count, pct: (w.count / maxW * 100) + '%' }));
    out.whenRows = parts.map((p) => ({ label: p.label, count: p.count, pct: (p.count / maxP * 100) + '%' }));
    out.contextTags = ctx.map((c) => c.label + ' · ' + c.count);
    out.noContext = ctx.length === 0;
    return out;
  }

  detailVals() {
    const s = this.state;
    const r = s.reports.find((q) => q.id === s.detailId);
    if (!r) return { hasDetail: false, detail: { cats: '', when: '', rows: [] }, closeDetail: () => {}, editReport: () => {} };
    const armed = s.deleteArmed;
    return {
      hasDetail: true,
      detail: { cats: r.cats.join(', '), when: this.fmtDay(r.date) + ' at ' + this.fmtTime(r.time), rows: this.reportRows(r) },
      closeDetail: () => this.setState({ detailId: null, deleteArmed: false }),
      editReport: () => this.startEdit(r),
      deleteLabel: armed ? 'Tap again to delete for good' : 'Delete report',
      deleteBg: armed ? '#B8430F' : '#FFFFFF',
      deleteFg: armed ? '#FFFFFF' : '#B8430F',
      deleteReport: () => {
        if (!this.state.deleteArmed) { this.setState({ deleteArmed: true }); return; }
        const reports = this.state.reports.filter((q) => q.id !== r.id);
        this.saveData(reports, this.state.symptomFree);
        this.setState({ reports: reports, detailId: null, deleteArmed: false });
        this.flash('Report deleted');
      }
    };
  }

  reportRows(r) {
    const rows = [
      { k: 'Where', v: r.points.map((p) => p.label).join(', ') },
      { k: 'Severity', v: r.severity + ' out of 10 · ' + this.sevWord(r.severity) + (r.sevNote ? '. ' + r.sevNote : '') }
    ];
    const add = (k, v) => { if (v && v.length) rows.push({ k: k, v: Array.isArray(v) ? v.join(', ') : v }); };
    add('Description', r.desc);
    add('Medicines taken', r.meds);
    add('Physical activity', r.acts);
    add('Other sensations', r.senses);
    add('Concerns', r.concern);
    return rows;
  }

  // ---- Shared log: a calendar picture on top, then every entry for the month ----
  shareEntries(month) {
    const s = this.state;
    const list = s.reports.filter((r) => r.date.slice(0, 7) === month).map((r) => ({ date: r.date, time: r.time, r: r }));
    s.symptomFree.filter((d) => d.slice(0, 7) === month && !s.reports.some((r) => r.date === d)).forEach((d) => list.push({ date: d, time: '', r: null }));
    return list.sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time));
  }
  shareSummary(list) {
    const reports = list.filter((x) => x.r);
    const days = new Set(reports.map((x) => x.date)).size, free = list.length - reports.length;
    return this.plural(reports.length, 'report') + ' on ' + this.plural(days, 'day') + ' · ' + this.plural(free, 'symptom-free day');
  }
  pdfTools() {
    const W = 1224, H = 1584, M = 84, BOTTOM = H - 110;
    const font = (w, px) => w + ' ' + px + 'px "Atkinson Hyperlegible", system-ui, sans-serif';
    const INK = '#14282C', SOFT = '#4F6368', LINE = '#D3DCDC';
    const meas = document.createElement('canvas').getContext('2d');
    const wrap = (text, f, width) => {
      meas.font = f;
      const out = [];
      String(text).split(/\r?\n/).forEach((para) => {
        let line = '';
        para.split(' ').forEach((word) => {
          const tryLine = line ? line + ' ' + word : word;
          if (meas.measureText(tryLine).width <= width) { line = tryLine; return; }
          if (line) out.push(line);
          line = word;
          while (meas.measureText(line).width > width) {
            let n = line.length - 1;
            while (n > 1 && meas.measureText(line.slice(0, n)).width > width) n--;
            out.push(line.slice(0, n));
            line = line.slice(n);
          }
        });
        out.push(line);
      });
      return out;
    };
    const text = (c, str, x, y, f, color) => { c.font = f; c.fillStyle = color; c.fillText(str, x, y); };
    return { W, H, M, BOTTOM, font, wrap, text, INK, SOFT, LINE };
  }
  renderPages(blocks) {
    const { W, H, M, BOTTOM, font, text, SOFT } = this.pdfTools();
    // Lay the blocks out on letter-size pages; headings stay with what follows them.
    const layout = [[]];
    let y = M;
    blocks.forEach((b, i) => {
      let need = b.h;
      for (let k = i; blocks[k] && blocks[k].keep && blocks[k + 1]; k++) need += blocks[k + 1].h;
      if (y + need > BOTTOM && layout[layout.length - 1].length) { layout.push([]); y = M; }
      layout[layout.length - 1].push({ b: b, y: y });
      y += b.h;
    });
    return layout.map((items, n) => {
      const canvas = document.createElement('canvas');
      canvas.width = W;
      canvas.height = H;
      const c = canvas.getContext('2d');
      c.fillStyle = '#FFFFFF';
      c.fillRect(0, 0, W, H);
      items.forEach((it) => it.b.draw(c, it.y));
      text(c, 'Self-reported log created with SomaSense. Not a medical record or diagnosis.', M, H - 56, font(400, 20), SOFT);
      c.font = font(400, 20);
      const page = 'Page ' + (n + 1) + ' of ' + layout.length;
      text(c, page, W - M - c.measureText(page).width, H - 56, font(400, 20), SOFT);
      return canvas.toDataURL('image/jpeg', 0.9);
    });
  }
  reportPages(range) {
    const { W, M, font, wrap, text, INK, SOFT, LINE } = this.pdfTools();
    const data = this.reportData(range);
    const blocks = [];
    const block = (h, draw, keep) => blocks.push({ h: h, draw: draw, keep: !!keep });
    const FILL = '#0B6169', TRACK = '#E4EAEA', WIDTH = W - 2 * M;
    const bar = (c, y, pct) => {
      c.fillStyle = TRACK;
      c.beginPath();
      c.roundRect(M, y, WIDTH, 12, 4);
      c.fill();
      if (!pct) return;
      c.fillStyle = FILL;
      c.beginPath();
      c.roundRect(M, y, Math.max(8, WIDTH * pct), 12, 4);
      c.fill();
    };
    const row = (c, y, left, right, pct, f) => {
      text(c, left, M, y + 26, f, INK);
      c.font = font(400, 24);
      text(c, right, W - M - c.measureText(right).width, y + 26, font(400, 24), INK);
      bar(c, y + 38, pct);
    };

    block(150, (c, y) => {
      text(c, 'SomaSense', M, y + 52, font(700, 52), INK);
      text(c, 'Frequency report · Last ' + range + ' days', M, y + 100, font(400, 32), INK);
      text(c, this.fmtShort(data.from) + ' to ' + this.fmtShort(this.TODAY) + ', ' + this.TODAY.slice(0, 4), M, y + 140, font(400, 26), SOFT);
    });
    const tiles = [[data.inRange.length, 'Reports'], [data.days, 'Days with symptoms'], [data.freeDays, 'Symptom-free days'], [data.avg, 'Avg severity']];
    block(140, (c, y) => {
      const gap = 16, w = (WIDTH - 3 * gap) / 4;
      tiles.forEach((t, i) => {
        const x = M + i * (w + gap);
        c.strokeStyle = LINE;
        c.lineWidth = 2;
        c.beginPath();
        c.roundRect(x, y + 8, w, 108, 12);
        c.stroke();
        text(c, String(t[0]), x + 16, y + 62, font(700, 42), INK);
        text(c, t[1], x + 16, y + 98, font(400, 20), SOFT);
      });
    });
    // The period as a calendar, week by week; days around it are greyed out.
    const start = this.weekStart(data.from), weeks = Math.ceil((Math.round((this.parse(this.TODAY) - this.parse(start)) / 864e5) + 1) / 7);
    const calH = 104;
    block(70, (c, y) => text(c, 'Calendar', M, y + 50, font(700, 36), INK), true);
    // Up to nine weeks fit under the summary on the first page, and twelve on a page after that.
    for (let w = 0; w < weeks; ) {
      const n = Math.min(w ? 12 : 9, weeks - w), at = w;
      block(50 + n * calH + 12, (c, y) => this.drawWeekGrid(c, y, this.addDays(start, at * 7), n, calH, data.from, this.TODAY), at + n >= weeks);
      w += n;
    }
    block(80, (c, y) => this.drawCalKey(c, y + 12));
    block(92, (c, y) => {
      text(c, 'How often, by type', M, y + 40, font(700, 36), INK);
      text(c, 'A report with two types counts once in each.', M, y + 76, font(400, 23), SOFT);
    }, true);
    const top = data.groups[0].list.length;
    data.groups.forEach((g) => {
      block(66, (c, y) => row(c, y, g.cat, this.plural(g.list.length, 'report') + ' · avg severity ' + data.mean(g.list), g.list.length / top, font(700, 26)));
    });

    data.groups.forEach((g) => {
      const d = this.typeDetail(g.list, range, data.from);
      block(26, () => {}, true);
      block(12, (c, y) => { c.fillStyle = LINE; c.fillRect(M, y + 4, WIDTH, 2); }, true);
      block(92, (c, y) => {
        text(c, g.cat, M, y + 46, font(700, 36), INK);
        text(c, this.plural(g.list.length, 'report') + ' in the last ' + range + ' days', M, y + 82, font(400, 24), SOFT);
      }, true);
      block(44, (c, y) => text(c, 'Over time (reports per ' + (d.size === 1 ? 'day' : 'week') + ')', M, y + 32, font(700, 25), INK), true);
      block(170, (c, y) => {
        const base = y + 124, gap = 8, w = (WIDTH - (d.buckets.length - 1) * gap) / d.buckets.length;
        c.textAlign = 'center';
        d.buckets.forEach((b, i) => {
          if (!b.n) return;
          const x = M + i * (w + gap), h = Math.max(8, b.n / d.maxB * 90);
          c.fillStyle = FILL;
          c.beginPath();
          c.roundRect(x, base - h, w, h, [4, 4, 0, 0]);
          c.fill();
          text(c, String(b.n), x + w / 2, base - h - 6, font(400, 22), INK);
        });
        c.textAlign = 'left';
        c.fillStyle = '#C4D0D0';
        c.fillRect(M, base, WIDTH, 2);
        const start = this.fmtShort(d.buckets[0].start), end = this.fmtShort(d.buckets[d.buckets.length - 1].end);
        text(c, start, M, base + 30, font(400, 21), SOFT);
        c.font = font(400, 21);
        text(c, end, W - M - c.measureText(end).width, base + 30, font(400, 21), SOFT);
      });
      block(44, (c, y) => text(c, 'Where on the body', M, y + 32, font(700, 25), INK), true);
      d.where.forEach((w) => block(60, (c, y) => row(c, y, w.label, String(w.count), w.count / d.where[0].count, font(400, 24))));
      block(44, (c, y) => text(c, 'Time of day', M, y + 32, font(700, 25), INK), true);
      d.parts.forEach((p) => block(60, (c, y) => row(c, y, p.label, String(p.count), p.count / d.maxP, font(400, 24))));
      if (d.ctx.length) {
        block(44, (c, y) => text(c, 'Logged alongside', M, y + 32, font(700, 25), INK), true);
        wrap(d.ctx.map((x) => x.label + ' (' + x.count + ')').join(', '), font(400, 25), WIDTH).forEach((line) => block(36, (c, y) => text(c, line, M, y + 26, font(400, 25), INK)));
      }
    });
    return this.renderPages(blocks);
  }
  reportText(range) {
    const data = this.reportData(range);
    const lines = ['SomaSense frequency report: last ' + range + ' days', this.fmtShort(data.from) + ' to ' + this.fmtShort(this.TODAY) + ', ' + this.TODAY.slice(0, 4), this.plural(data.inRange.length, 'report') + ' on ' + this.plural(data.days, 'day') + ' · ' + this.plural(data.freeDays, 'symptom-free day') + ' · average severity ' + data.avg, 'The full report is in the attached PDF.', ''];
    data.groups.forEach((g) => lines.push(g.cat + ': ' + this.plural(g.list.length, 'report') + ', average severity ' + data.mean(g.list)));
    return lines.join('\n');
  }
  // Rows of weeks a month needs.
  calGridHeight(month, cellH) {
    const parts = month.split('-').map(Number);
    const lead = new Date(parts[0], parts[1] - 1, 1).getDay(), daysIn = new Date(parts[0], parts[1], 0).getDate();
    return 50 + Math.ceil((lead + daysIn) / 7) * cellH;
  }
  // One day as it looks in the Calendar tab. A day outside the period is greyed out.
  drawDayCell(c, x, top, cellW, cellH, key, label, out) {
    const { font, text, INK, LINE } = this.pdfTools();
    const dayList = out ? [] : this.state.reports.filter((r) => r.date === key);
    const max = dayList.reduce((m, r) => Math.max(m, r.severity), 0);
    const free = !out && !dayList.length && this.state.symptomFree.includes(key);
    c.fillStyle = free ? '#8EDB8F' : !dayList.length ? '#FFFFFF' : max <= 3 ? '#D6ECEC' : max <= 6 ? '#86C6C4' : '#0B6169';
    c.strokeStyle = out ? '#E9EEEE' : LINE;
    c.lineWidth = 2;
    c.beginPath();
    c.roundRect(x + 4, top + 4, cellW - 8, cellH - 8, 14);
    c.fill();
    c.stroke();
    const fg = out ? '#A5B4B5' : dayList.length && max > 6 ? '#FFFFFF' : INK;
    c.textAlign = 'center';
    text(c, label, x + cellW / 2, top + cellH * 0.46, font(700, label.length > 2 ? 26 : 30), fg);
    if (dayList.length) text(c, this.plural(dayList.length, 'report'), x + cellW / 2, top + cellH * 0.76, font(400, 21), fg);
    c.textAlign = 'left';
    if (free) {
      c.strokeStyle = INK;
      c.lineWidth = 4;
      c.lineCap = 'round';
      c.lineJoin = 'round';
      const cx = x + cellW / 2, cy = top + cellH * 0.7;
      c.beginPath();
      c.moveTo(cx - 13, cy);
      c.lineTo(cx - 4, cy + 9);
      c.lineTo(cx + 13, cy - 9);
      c.stroke();
    }
  }
  drawWeekdays(c, y) {
    const { W, M, font, text, SOFT } = this.pdfTools();
    const cellW = (W - 2 * M) / 7;
    c.textAlign = 'center';
    ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'].forEach((d, i) => text(c, d, M + cellW * (i + 0.5), y + 34, font(700, 24), SOFT));
    c.textAlign = 'left';
  }
  // A month as it looks in the Calendar tab.
  drawCalGrid(c, y, month, cellH) {
    const { W, M } = this.pdfTools();
    const parts = month.split('-').map(Number);
    const lead = new Date(parts[0], parts[1] - 1, 1).getDay(), daysIn = new Date(parts[0], parts[1], 0).getDate();
    const cellW = (W - 2 * M) / 7;
    this.drawWeekdays(c, y);
    for (let d = 1; d <= daysIn; d++) {
      const at = lead + d - 1;
      this.drawDayCell(c, M + (at % 7) * cellW, y + 50 + Math.floor(at / 7) * cellH, cellW, cellH, month + '-' + String(d).padStart(2, '0'), String(d), false);
    }
  }
  // Whole weeks from the Sunday on or before `from`; the first of a month and the first cell name the month.
  weekStart(from) { return this.addDays(from, -this.parse(from).getDay()); }
  drawWeekGrid(c, y, start, weeks, cellH, from, to) {
    const { W, M } = this.pdfTools();
    const cellW = (W - 2 * M) / 7;
    this.drawWeekdays(c, y);
    for (let i = 0; i < weeks * 7; i++) {
      const key = this.addDays(start, i), d = Number(key.slice(8));
      const label = d === 1 || i === 0 ? this.fmtShort(key) : String(d);
      this.drawDayCell(c, M + (i % 7) * cellW, y + 50 + Math.floor(i / 7) * cellH, cellW, cellH, key, label, key < from || key > to);
    }
  }
  drawCalKey(c, y) {
    const { M, font, SOFT, LINE } = this.pdfTools();
    let x = M;
    [['#FFFFFF', 'No entry'], ['#8EDB8F', 'No symptoms'], ['#D6ECEC', 'Mild (1–3)'], ['#86C6C4', 'Moderate (4–6)'], ['#0B6169', 'Severe (7–10)']].forEach((k) => {
      c.fillStyle = k[0];
      c.strokeStyle = LINE;
      c.lineWidth = 2;
      c.beginPath();
      c.roundRect(x, y, 28, 28, 6);
      c.fill();
      c.stroke();
      c.font = font(400, 23);
      c.fillStyle = SOFT;
      c.fillText(k[1], x + 36, y + 22);
      x += 36 + c.measureText(k[1]).width + 30;
    });
  }
  sharePages(month) {
    const { W, M, font, wrap, text, INK, SOFT, LINE } = this.pdfTools();
    const parts = month.split('-').map(Number);
    const first = new Date(parts[0], parts[1] - 1, 1);
    const title = first.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
    const daysIn = new Date(parts[0], parts[1], 0).getDate();
    const list = this.shareEntries(month);
    const blocks = [];
    const block = (h, draw, keep) => blocks.push({ h: h, draw: draw, keep: !!keep });

    // Heading.
    block(150, (c, y) => {
      text(c, 'SomaSense', M, y + 52, font(700, 52), INK);
      text(c, 'Symptom log · ' + title, M, y + 100, font(400, 32), INK);
      text(c, this.shareSummary(list), M, y + 140, font(400, 26), SOFT);
    });

    // The calendar picture.
    const cellH = 118;
    block(this.calGridHeight(month, cellH) + 90, (c, y) => {
      this.drawCalGrid(c, y, month, cellH);
      this.drawCalKey(c, y + this.calGridHeight(month, cellH) + 22);
    });

    // Entries, in the same format as a report in the app.
    block(70, (c, y) => text(c, 'Entries', M, y + 50, font(700, 36), INK), true);
    if (!list.length) block(50, (c, y) => text(c, 'Nothing was logged this month.', M, y + 34, font(400, 28), SOFT));
    list.forEach((x) => {
      const when = this.fmtDay(x.date) + (x.r ? ' at ' + this.fmtTime(x.time) : '');
      block(12, (c, y) => { c.fillStyle = LINE; c.fillRect(M, y + 4, W - 2 * M, 2); }, true);
      if (!x.r) {
        block(58, (c, y) => {
          text(c, when, M, y + 36, font(700, 28), INK);
          c.font = font(700, 28);
          text(c, 'No symptoms', W - M - c.measureText('No symptoms').width, y + 36, font(700, 28), '#1F6B33');
        });
        return;
      }
      block(48, (c, y) => text(c, when, M, y + 36, font(700, 28), INK), true);
      wrap(x.r.cats.join(', '), font(700, 26), W - 2 * M).forEach((line) => block(36, (c, y) => text(c, line, M, y + 26, font(700, 26), '#0B6169'), true));
      this.reportRows(x.r).forEach((row, i, all) => {
        block(38, (c, y) => text(c, row.k, M, y + 30, font(700, 22), SOFT), true);
        const lines = wrap(row.v, font(400, 26), W - 2 * M);
        lines.forEach((line, n) => block(n === lines.length - 1 ? 44 : 34, (c, y) => text(c, line, M, y + 26, font(400, 26), INK), false));
      });
    });

    const picture = document.createElement('canvas');
    picture.width = W;
    picture.height = M + blocks[0].h + blocks[1].h;
    const pc = picture.getContext('2d');
    pc.fillStyle = '#FFFFFF';
    pc.fillRect(0, 0, W, picture.height);
    blocks[0].draw(pc, M);
    blocks[1].draw(pc, M + blocks[0].h);
    const pages = this.renderPages(blocks);
    return { pages: pages, calendar: picture.toDataURL('image/png') };
  }
  shareText(month, title) {
    const list = this.shareEntries(month);
    const lines = ['SomaSense symptom log: ' + title, this.shareSummary(list), 'The calendar picture and a PDF of this log are attached.', ''];
    list.forEach((x) => {
      if (!x.r) { lines.push(this.fmtDay(x.date) + ': No symptoms', ''); return; }
      lines.push(this.fmtDay(x.date) + ' at ' + this.fmtTime(x.time), x.r.cats.join(', '));
      this.reportRows(x.r).forEach((row) => lines.push(row.k + ': ' + row.v));
      lines.push('');
    });
    const body = lines.join('\n');
    return body.length > 20000 ? body.slice(0, 20000) + '\n\nThe full log continues in the attached PDF.' : body;
  }
  // A small PDF writer: each page is one picture, so any language or symbol in an entry prints correctly.
  pdfBase64(pages) {
    const enc = (t) => Uint8Array.from(t, (ch) => ch.charCodeAt(0) & 255);
    const chunks = [];
    let size = 0;
    const put = (b) => { const u = typeof b === 'string' ? enc(b) : b; chunks.push(u); size += u.length; };
    const offsets = [];
    const obj = (n, body) => { offsets[n] = size; put(n + ' 0 obj\n' + body + '\nendobj\n'); };
    put('%PDF-1.4\n');
    obj(1, '<< /Type /Catalog /Pages 2 0 R >>');
    obj(2, '<< /Type /Pages /Count ' + pages.length + ' /Kids [' + pages.map((_, i) => (3 + i * 3) + ' 0 R').join(' ') + '] >>');
    pages.forEach((url, i) => {
      const n = 3 + i * 3;
      const raw = atob(url.split(',')[1]);
      obj(n, '<< /Type /Page /Parent 2 0 R /MediaBox [0 0 612 792] /Resources << /XObject << /Im0 ' + (n + 1) + ' 0 R >> >> /Contents ' + (n + 2) + ' 0 R >>');
      offsets[n + 1] = size;
      put((n + 1) + ' 0 obj\n<< /Type /XObject /Subtype /Image /Width 1224 /Height 1584 /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ' + raw.length + ' >>\nstream\n');
      put(enc(raw));
      put('\nendstream\nendobj\n');
      const content = 'q 612 0 0 792 0 0 cm /Im0 Do Q';
      obj(n + 2, '<< /Length ' + content.length + ' >>\nstream\n' + content + '\nendstream');
    });
    const count = 3 + pages.length * 3;
    const xref = size;
    let table = 'xref\n0 ' + count + '\n0000000000 65535 f \n';
    for (let n = 1; n < count; n++) table += String(offsets[n]).padStart(10, '0') + ' 00000 n \n';
    put(table + 'trailer\n<< /Size ' + count + ' /Root 1 0 R >>\nstartxref\n' + xref + '\n%%EOF\n');
    let out = '';
    chunks.forEach((u) => {
      for (let i = 0; i < u.length; i += 0x6000) out += String.fromCharCode.apply(null, u.subarray(i, i + 0x6000));
    });
    return btoa(out);
  }
  fontsReady() {
    return (document.fonts ? Promise.all([document.fonts.load('400 20px "Atkinson Hyperlegible"'), document.fonts.load('700 20px "Atkinson Hyperlegible"')]) : Promise.resolve()).catch(() => {});
  }
  openShare() {
    const month = this.state.calMonth;
    const parts = month.split('-').map(Number);
    const title = new Date(parts[0], parts[1] - 1, 1).toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
    this.fontsReady().then(() => this.setState({ share: {
      tab: 'calendar', heading: 'Share this month’s log', note: 'This sends everything logged this month. You choose the app and the recipient next.',
      subject: 'SomaSense symptom log: ' + title, text: this.shareText(month, title), name: 'SomaSense-' + month,
      ...this.sharePages(month)
    } }));
  }
  openReportShare() {
    const range = this.state.range;
    if (!this.reportData(range).inRange.length) { this.flash('There are no reports in this period to share.'); return; }
    this.fontsReady().then(() => this.setState({ share: {
      tab: 'reports', heading: 'Share this report', note: 'This shares the summary for the last ' + range + ' days. You choose the app and the recipient next.',
      subject: 'SomaSense frequency report: last ' + range + ' days', text: this.reportText(range), name: 'SomaSense-report-' + range + '-days-' + this.TODAY,
      pages: this.reportPages(range)
    } }));
  }
  sendShare() {
    const sh = this.state.share;
    if (!this.live) { this.flash('Sharing opens from the Android app. This preview shows what gets sent.'); return; }
    const pdf = this.pdfBase64(sh.pages);
    const ok = sh.calendar ? window.AppShell.shareLog(sh.subject, sh.text, sh.name, sh.calendar.split(',')[1], pdf) : window.AppShell.sharePdf(sh.subject, sh.text, sh.name, pdf);
    if (!ok) this.flash('This could not be prepared for sharing.');
  }
  saveShare() {
    const sh = this.state.share;
    if (!this.live) { this.flash('Saving opens from the Android app. This preview shows what gets saved.'); return; }
    if (!window.AppShell.savePdf(sh.name, this.pdfBase64(sh.pages))) this.flash('The PDF could not be prepared.');
  }
  shareVals() {
    const sh = this.state.share;
    return {
      hasShare: !!sh && this.state.tab === sh.tab && !this.state.composing,
      shareHeading: sh ? sh.heading : '',
      shareNote: sh ? sh.note : '',
      saveShare: () => this.saveShare(),
      sharePreviewPages: sh ? sh.pages : [],
      startShare: () => this.openShare(),
      closeShare: () => this.setState({ share: null }),
      sendShare: () => this.sendShare()
    };
  }

  renderVals() {
    const s = this.state;
    const nav = (id) => ({
      current: s.tab === id ? 'page' : undefined,
      weight: s.tab === id ? 700 : 400,
      pill: s.tab === id ? '#D6ECEC' : 'transparent',
      pick: () => this.setState({ ...(s.editing ? this.endEdit() : {}), tab: id, ...this.resetZoom() })
    });
    return {
      phoneH: Number(this.props.phoneH) || 844,
      figH: this.figSize().h,
      figW: this.figSize().w,
      isHome: s.tab === 'home' && !s.composing,
      isCalendar: s.tab === 'calendar' && !s.composing,
      isReports: s.tab === 'reports' && !s.composing,
      isSettings: s.tab === 'settings' && !s.composing,
      composing: s.composing,
      showNav: !s.composing && !(s.tab === 'home' && s.selected.length > 0),
      navHome: nav('home'),
      navCal: nav('calendar'),
      navRep: nav('reports'),
      navSet: nav('settings'),
      showSplash: s.splash !== 'off',
      splashUrl: this.SPLASH_URL,
      splashOpacity: s.splash === 'out' ? 0 : 1,
      splashImgOpacity: s.splashImg ? 1 : 0,
      splashInMs: this.calmMotion() ? 0 : this.SPLASH_IN,
      splashFadeMs: this.calmMotion() ? 0 : this.SPLASH_FADE,
      splashLoaded: () => this.splashLoaded(),
      skipSplash: () => this.splashOut(),
      hasToast: !!s.toast,
      toast: s.toast,
      ...this.homeVals(),
      ...this.composeVals(),
      ...this.calendarVals(),
      ...this.reportsVals(),
      ...this.settingsVals(),
      ...this.detailVals(),
      ...this.shareVals()
    };
  }
}

startApp(Component);
</script>
